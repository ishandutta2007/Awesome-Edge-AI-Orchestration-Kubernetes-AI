<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="radial-ambient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="slight-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.4px;
      }
      .node-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #38bdf8;
      }

      /* Dynamic Wave / Pulse Animations in background */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-orb-1 {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .animated-orb-2 {
        animation: pulseOrb 10s ease-in-out infinite reverse;
        transform-origin: 1000px 320px;
      }
      .floating-group-1 {
        animation: floatNode 6s ease-in-out infinite;
      }
      .floating-group-2 {
        animation: floatNode 7s ease-in-out infinite 1s;
      }
      .flow-path {
        stroke-dasharray: 6, 6;
        animation: dashFlow 2s linear infinite;
      }
      .radar-line {
        transform-origin: 1050px 120px;
        animation: radarSweep 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />
  <rect width="1200" height="420" fill="url(#radial-ambient)" rx="16" />

  <!-- Animated Background Glow Orbs (Behind content) -->
  <g opacity="0.6">
    <circle class="animated-orb-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
    <circle class="animated-orb-2" cx="980" cy="310" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.25" />
    <circle cx="600" cy="210" r="220" fill="#4f46e5" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Dynamic Edge Topology Background Illustration (Right Side, Subtle) -->
  <g opacity="0.75" class="floating-group-1">
    <!-- Connecting flow lines -->
    <path class="flow-path" d="M 880 120 L 980 90 L 1080 140 L 1020 230 L 910 200 Z" fill="none" stroke="#0284c7" stroke-width="1.5" />
    <path class="flow-path" d="M 980 90 L 1020 230" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <line x1="880" y1="120" x2="820" y2="250" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="1020" y1="230" x2="1110" y2="280" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Node 1: Cloud/K8s Control Plane -->
    <g transform="translate(980, 90)">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#slight-glow)" />
      <circle r="6" fill="#38bdf8" />
      <text x="0" y="36" text-anchor="middle" class="node-text">K8s Control</text>
    </g>

    <!-- Node 2: GPU Edge Server -->
    <g transform="translate(1080, 140)">
      <circle r="18" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#slight-glow)" />
      <circle r="5" fill="#c084fc" />
      <text x="0" y="32" text-anchor="middle" class="node-text" fill="#c084fc">Edge GPU</text>
    </g>

    <!-- Node 3: MicroK8s / K3s Gateway -->
    <g transform="translate(1020, 230)">
      <circle r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#slight-glow)" />
      <circle r="5" fill="#34d399" />
      <text x="0" y="32" text-anchor="middle" class="node-text" fill="#34d399">K3s Worker</text>
    </g>

    <!-- Node 4: Autonomous Leaf Sensor -->
    <g transform="translate(880, 120)">
      <circle r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle r="4" fill="#38bdf8" />
      <text x="0" y="28" text-anchor="middle" class="node-text">IoT Leaf</text>
    </g>

    <!-- Node 5: AI Inference Cluster -->
    <g transform="translate(910, 200)">
      <circle r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle r="4" fill="#fbbf24" />
      <text x="0" y="30" text-anchor="middle" class="node-text" fill="#fbbf24">vLLM / NPU</text>
    </g>
  </g>

  <!-- Left Dynamic Element: Decorative Circuit & Signal waves -->
  <g opacity="0.4" class="floating-group-2">
    <path class="flow-path" d="M 60 80 L 140 80 L 180 120 L 180 200 L 120 260 L 60 260" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="180" cy="120" r="4" fill="#38bdf8" />
    <circle cx="180" cy="200" r="4" fill="#818cf8" />
    <circle cx="120" cy="260" r="4" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles, Feature Badges (Always in crisp foreground) -->
  <g transform="translate(80, 85)">

    <!-- Top Category Tag -->
    <g transform="translate(0, 0)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="30" y="20" class="badge-text" fill="#38bdf8">⚡ CLOUD-NATIVE &amp; EDGE AI</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="80" class="title-text">
      Awesome Edge AI Orchestration
    </text>
    <text x="0" y="128" class="title-text" fill="url(#primary-glow)">
      &amp; Kubernetes AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text">
      Curated ecosystem of edge Kubernetes distributions, distributed GPU orchestration,
    </text>
    <text x="0" y="198" class="subtitle-text">
      autonomous edge inference fleets, and cloud-to-edge device synchronization.
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: K8s Edge -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="65" y="21" text-anchor="middle" class="badge-text" fill="#e0f2fe">☸️ K8s at Edge</text>
      </g>
      <!-- Badge 2: GPU Fleet -->
      <g transform="translate(142, 0)">
        <rect width="145" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" class="badge-text" fill="#ede9fe">🚀 GPU Operators</text>
      </g>
      <!-- Badge 3: LLM Inference -->
      <g transform="translate(299, 0)">
        <rect width="150" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text x="75" y="21" text-anchor="middle" class="badge-text" fill="#fae8ff">🤖 Local Inference</text>
      </g>
      <!-- Badge 4: Edge MLOps -->
      <g transform="translate(461, 0)">
        <rect width="135" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text x="67" y="21" text-anchor="middle" class="badge-text" fill="#ecfdf5">🌐 Zero-Trust</text>
      </g>
    </g>

  </g>

  <!-- Border Frame Glow -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
